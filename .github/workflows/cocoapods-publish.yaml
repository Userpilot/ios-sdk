# 📦 GitHub Actions workflow to deploy and iOS SDK release.

name: Release and Publish to CocoaPods

on:
  # 🎛️ Manual only. A CocoaPods trunk push is irreversible — a published version can
  # only be deprecated, never removed — so it must be a deliberate act, not a side
  # effect of pushing a branch.
  #
  # Run it from Actions → "Release and Publish to CocoaPods" → Run workflow,
  # selecting the branch to release from (`main` or a `release/*` branch) and the
  # version bump to apply.
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump for this release'
        required: true
        default: 'beta'
        type: choice
        options:
          - major
          - minor
          - patch
          - beta
          - rc

# 🛑 Never run two releases against the same branch at once
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # ✅ First job: reject the wrong branch before anything is mutated.
  # This must precede the bump — a manual dispatch can select ANY branch, and bumping
  # first would leave a stray version commit and tag on a branch we then reject.
  validate-branch:
    name: Validate branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Validate branch
        run: |
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          if [[ "$BRANCH" != "main" && "$BRANCH" != release/* ]]; then
            echo "::error::Must release from 'main' or a 'release/*' branch. Selected: $BRANCH"
            exit 1
          fi
          echo "Branch validation passed: $BRANCH"

  # 🔖 Second job: Trigger the bump version workflow and wait for completion
  bump-version:
    needs: validate-branch
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      # 🧩 Trigger the bump version workflow and wait for THIS dispatch to finish.
      # We record the dispatch timestamp first, then only accept a run created after
      # it — otherwise a previously completed bump run satisfies the poll instantly
      # and we would publish an un-bumped version.
      - name: Trigger bump version workflow and wait
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.NPM_TOKEN }}
          script: |
            const workflow_id = 'bump-version.yml';
            const { owner, repo } = context.repo;

            // Timestamp just before dispatch (minus a small skew allowance)
            const dispatchedAt = new Date(Date.now() - 10_000);

            // Pass through the bump chosen when this release was dispatched
            const bump = '${{ inputs.bump }}';

            await github.rest.actions.createWorkflowDispatch({
              owner, repo, workflow_id,
              ref: context.ref,
              inputs: { bump },
            });
            console.log(`Bump version workflow dispatched (bump=${bump}) at ${dispatchedAt.toISOString()}`);

            const maxAttempts = 40; // up to ~20 minutes (40 * 30 seconds)
            let runId = null;

            for (let attempt = 1; attempt <= maxAttempts; attempt++) {
              await new Promise(r => setTimeout(r, 30_000));

              // Find OUR run: created after dispatch
              if (runId === null) {
                const { data } = await github.rest.actions.listWorkflowRuns({
                  owner, repo, workflow_id, per_page: 20,
                });
                const mine = data.workflow_runs
                  .filter(r => new Date(r.created_at) >= dispatchedAt)
                  .sort((a, b) => new Date(a.created_at) - new Date(b.created_at))[0];
                if (!mine) {
                  console.log(`Bump run not visible yet... (attempt ${attempt}/${maxAttempts})`);
                  continue;
                }
                runId = mine.id;
                console.log(`Tracking bump run #${runId} (${mine.html_url})`);
              }

              const { data: run } = await github.rest.actions.getWorkflowRun({
                owner, repo, run_id: runId,
              });
              console.log(`Run #${runId}: status=${run.status}, conclusion=${run.conclusion}`);

              if (run.status !== 'completed') continue;
              if (run.conclusion === 'success') return;
              throw new Error(`Bump version workflow failed with conclusion: ${run.conclusion}`);
            }

            throw new Error('Timeout waiting for bump version workflow to complete');

      # 📥 Checkout the updated code after version bump
      - name: Checkout updated code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
          token: ${{ secrets.NPM_TOKEN }}

      # 📥 Extract the new version after bump
      - name: Extract bumped version
        id: get-version
        run: |
          # Ensure we have the latest changes
          git pull origin ${{ github.ref_name }}
          
          file="./Sources/Userpilot/Version.swift"
          major=$(grep 'private let versionMajor' "$file" | grep -oE '[0-9]+')
          minor=$(grep 'private let versionMinor' "$file" | grep -oE '[0-9]+')
          patch_line=$(grep 'private let versionPatch' "$file")
          patch_with_suffix=$(echo "$patch_line" | grep -oE '[0-9]+(-(beta|rc)\.[0-9]+)?')
          version="$major.$minor.$patch_with_suffix"
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "Bumped version: $version"

  # 📝 Third job: Create GitHub Release
  create-release:
    needs: [bump-version, validate-branch]
    runs-on: macOS-latest
    steps:
      # 📥 Checkout code with the latest changes including version bump
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
          token: ${{ secrets.NPM_TOKEN }}

      # 📥 Pull latest changes to ensure we have the version bump
      - name: Pull latest changes
        run: |
          git pull origin ${{ github.ref_name }}

      # 📝 Generate changelog from git commits between latest tags
      - name: Generate changelog
        id: changelog
        run: |
          VERSION="${{ needs.bump-version.outputs.version }}"
          TAG_NAME="$VERSION"
          PREV_TAG=$(git describe --tags --abbrev=0 "$TAG_NAME"^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- [%as] %s (%h)" --abbrev=7 | sed '/[🔧🎬⬆📸✅💡📝]/d')
          else
            CHANGELOG=$(git log --pretty=format:"- [%as] %s (%h)" "$PREV_TAG..$TAG_NAME" --abbrev=7 | sed '/[🔧🎬⬆📸✅💡📝]/d')
          fi
          echo "$CHANGELOG" > changelog.txt
          echo "Generated changelog between $PREV_TAG and $TAG_NAME"

      # 📝 Create GitHub Release using the bumped version
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.bump-version.outputs.version }}
          name: ${{ needs.bump-version.outputs.version }}
          body_path: changelog.txt
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.NPM_TOKEN }}

  # 🚀 Fourth job: Publish to CocoaPods
  publish-cocoapods:
    needs: [bump-version, validate-branch, create-release]
    runs-on: macOS-latest
    steps:
      # 📥 Checkout code with the latest changes including version bump
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
          token: ${{ secrets.NPM_TOKEN }}

      # 📥 Pull latest changes to ensure we have the version bump and tags
      - name: Pull latest changes and tags
        run: |
          git pull origin ${{ github.ref_name }}
          git fetch --tags

      # ⚙️ Install CocoaPods
      - name: Install CocoaPods
        run: gem install cocoapods

      # 🔧 Update podspec version FIRST. `pod spec lint` resolves
      # spec.source's `:tag => "#{spec.version}"`, so linting before this step
      # would validate the PREVIOUS release's tag and tell us nothing about the
      # version we are about to publish.
      - name: Update podspec version
        run: |
          VERSION="${{ needs.bump-version.outputs.version }}"
          PODSPEC=$(find . -name "*.podspec" -maxdepth 1 | head -n 1)
          if [ -z "$PODSPEC" ]; then
            echo "::error::No .podspec file found in root directory"
            exit 1
          fi
          echo "Found podspec: $PODSPEC"

          # Update version in podspec file
          sed -i '' "s/spec\.version[[:space:]]*=[[:space:]]*['\"][^'\"]*['\"]/spec.version       = \"$VERSION\"/" "$PODSPEC"
          echo "Updated podspec version to $VERSION"
          grep "spec\.version" "$PODSPEC"

          # The podspec version drives the git tag it resolves — they must agree
          if ! grep -q "\"$VERSION\"" "$PODSPEC"; then
            echo "::error::podspec version did not update to $VERSION"
            exit 1
          fi

      # 📄 Commit podspec changes so the tag's tree carries the right version
      - name: Commit podspec changes
        run: |
          git config user.name "motasem-userpilot"
          git config user.email "motasem@userpilot.co"

          if git diff --quiet; then
            echo "No changes to commit"
          else
            git add *.podspec
            git commit -m "📦 update podspec version to ${{ needs.bump-version.outputs.version }}"
            git push
          fi

      # ✅ Validate the podspec we are actually about to publish
      - name: Validate podspec
        run: |
          PODSPEC=$(find . -name "*.podspec" -maxdepth 1 | head -n 1)
          pod lib lint "$PODSPEC" --allow-warnings
          echo "Podspec validation passed"

      # 🚀 Deploy to CocoaPods using the action
      - name: Deploy to CocoaPods
        uses: michaelhenry/deploy-to-cocoapods-github-action@1.0.10
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}

      # 🎉 Verify deployment
      - name: Verify CocoaPods deployment
        run: |
          VERSION="${{ needs.bump-version.outputs.version }}"
          PODNAME=$(find . -name "*.podspec" -maxdepth 1 | head -n 1 | xargs basename -s .podspec)
          
          echo "Waiting for CocoaPods to process the new version..."
          sleep 30
          
          # Try to search for the pod (this might take a few minutes to be available)
          pod search "$PODNAME" || echo "Pod might not be immediately searchable, but deployment completed"
          echo "CocoaPods deployment completed for $PODNAME version $VERSION"